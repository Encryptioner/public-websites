<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/public-websites/style.css" />
    <title>Not found · Public Websites</title>
  </head>
  <body>
    <header class="hero">
      <h1>404</h1>
      <p class="lead">
        Page not found. The site you’re looking for may have moved or is no longer
        published.
      </p>
      <p><a href="/public-websites/">← Back to all sites</a></p>
    </header>
    <!-- Absolute path: GitHub Pages serves this file from any depth, so a relative
         import would resolve against the missing URL's directory. -->
    <script type="module">
      import { track } from "/public-websites/analytics.js";
      // Which dead links people hit — the requested path, not the referrer.
      track("not_found", { path: location.pathname + location.search });
      document.querySelector("a").addEventListener("click", () => track("not_found_recovered"));
    </script>
  </body>
</html>
