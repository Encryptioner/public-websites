<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Any Page — paste any public HTML URL and view it as a live page or presentation. No sign-up, nothing stored."
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta property="og:title" content="Any Page · Public Websites" />
    <meta
      property="og:description"
      content="Paste any public HTML URL and view it as a live page or presentation."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../panel.css" />
    <link rel="stylesheet" href="./viewer.css" />
    <title>Any Page · Public Websites</title>
    <style>
      /* Base resets, tokens, and the .panel/.row/.actions/.hint/.field-note component
         all come from ../panel.css; viewer chrome (#viewerWrap, .corner, .icon-btn, ...)
         comes from ./viewer.css. Only this page's own landing-form layout lives here. */

      /* --- Landing form (no URL) — .panel/.row/.actions/.hint/.field-note/.back
         all come from ../panel.css; this just centers the panel in the viewport. --- */
      .landing { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .landing .panel { width: 100%; }
    </style>
  </head>
  <body>
    <script type="module">
      "use strict";

      import { isHttpUrl, wireUrlField, DISABLED_REASON, TIP } from "../url-field.js";
      import { buildViewerLink, readViewerTarget, linkFormat } from "../viewer-link.js";
      import { track, hostOf } from "../analytics.js";
      import { ICONS, renderViewer } from "./viewer.js";

      // Both link forms (#host/path and ?url=<encoded>) are read by the shared
      // ../viewer-link.js — the one place the format lives.
      const { target, format } = readViewerTarget();

      // The hash form is now the default link, and a hash-only change (typing a new
      // target in the address bar, or following an any-page/#… link while already on
      // any-page) does NOT reload the document — without this the page would keep
      // showing the previous target. ponytail: reload beats re-plumbing render state.
      window.addEventListener("hashchange", () => location.reload());

      function renderLanding(prefill, errorMsg) {
        document.body.innerHTML = `
          <div class="landing">
            <div class="panel">
              <h1>Any Page</h1>
              <p class="lede">Paste any public HTML URL and view it as a live page or presentation. Nothing is stored — it renders in your browser.</p>
              <form class="row" id="f">
                <div class="field">
                  <input id="u" type="url" inputmode="url" autocomplete="off"
                    placeholder="https://example.com/slides/index.html" />
                  <div class="field-actions">
                    <button type="button" class="field-btn" id="copyInputBtn" aria-label="Copy" data-tip="Copy">${ICONS.copy}</button>
                    <button type="button" class="field-btn" id="clearBtn" aria-label="Clear" data-tip="Clear">${ICONS.close}</button>
                  </div>
                </div>
                <p class="field-note" id="fieldNote" hidden>${ICONS.alert} <span>${DISABLED_REASON}</span></p>
                <div class="actions">
                  <button type="submit" class="btn-primary" id="viewBtn" disabled>View</button>
                  <button type="button" class="btn-secondary" id="copyBtn" disabled>Copy link</button>
                </div>
              </form>
              <p class="hint${errorMsg ? " err" : ""}" id="hint">${errorMsg || TIP}</p>
              <a class="back" href="../">← Back to Public Websites</a>
            </div>
          </div>`;
        const input = document.getElementById("u");
        if (prefill) input.value = prefill;

        wireUrlField({
          input,
          viewBtn: document.getElementById("viewBtn"),
          copyBtn: document.getElementById("copyBtn"),
          fieldNote: document.getElementById("fieldNote"),
          copyInputBtn: document.getElementById("copyInputBtn"),
          clearBtn: document.getElementById("clearBtn"),
          viewerBase: "./",
          context: "any_page",
        });

        document.getElementById("f").addEventListener("submit", (e) => {
          e.preventDefault();
          const v = input.value.trim();
          if (!isHttpUrl(v)) {
            document.getElementById("hint").textContent = "Enter a valid http(s) URL.";
            document.getElementById("hint").classList.add("err");
            track("viewer_open_rejected", { context: "any_page" });
            return;
          }
          track("viewer_opened", { context: "any_page", host: hostOf(v), link_format: linkFormat(v) });
          // Open in a new tab so the landing form stays put — lets you queue up
          // several pages instead of losing the form on every View click.
          window.open(buildViewerLink(v, "./"), "_blank", "noopener");
        });

        document.querySelector(".back").addEventListener("click", () => track("back_to_hub_clicked"));
      }

      if (target && isHttpUrl(target)) {
        // entry_format tells which link form visitors actually arrive on — the
        // signal for whether the hash default is worth keeping.
        track("any_page_entered", { mode: "viewer", entry_format: format, host: hostOf(target) });
        renderViewer(target, (err) =>
          renderLanding(target, "Couldn't load that URL: " + err.message + ". It may block cross-origin access or be offline.")
        );
      } else {
        track("any_page_entered", { mode: "landing", entry_format: format || "none", host: target ? hostOf(target) : "none" });
        renderLanding(target && !isHttpUrl(target) ? target : "", target ? "That wasn't a valid http(s) URL." : "");
      }
    </script>
  </body>
</html>
